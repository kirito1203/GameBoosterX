name: Gerar APK - OMNI C71

on:
  push:
    branches: [ omni-c71 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Mantém a mesma chave entre builds, para instalar versões novas por cima
      - name: Reutilizar chave de debug
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: omni-debug-keystore-v1

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - name: Renomear
        run: cp app/build/outputs/apk/debug/app-debug.apk OMNI-C71.apk

      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: omni-c71-v${{ github.run_number }}
          name: OMNI C71 v${{ github.run_number }}
          files: OMNI-C71.apk
          make_latest: false
          target_commitish: ${{ github.sha }}
