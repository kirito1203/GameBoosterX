name: Build Pulse Solar APK

on:
  push:
    branches: [ main, master, pulse-solar ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (já instalado no runner) e licenças
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Preparar Gradle (com cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK de depuração
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PulseSolar-${{ github.run_number }}.apk

      - name: Guardar APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: PulseSolar-apk-${{ github.run_number }}
          path: PulseSolar-${{ github.run_number }}.apk
          retention-days: 30

      - name: Publicar em Releases (link direto)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pulse-solar-${{ github.run_number }}
          name: Pulse Solar build ${{ github.run_number }}
          body: |
            APK de depuração gerado automaticamente pelo GitHub Actions.
            Commit: ${{ github.sha }}
          target_commitish: ${{ github.sha }}
          files: PulseSolar-${{ github.run_number }}.apk
