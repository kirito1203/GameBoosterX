name: Build APK — RPG Dice

on:
  push:
    branches: [ rpg-dice ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      # Mantém a mesma chave de debug entre builds, então a versão nova
      # instala por cima da antiga. A chave fica só no cache do Actions.
      - name: Reutilizar chave de debug
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: rpgdice-debug-keystore-v1

      - name: Permissão do gradlew
        run: chmod +x gradlew

      - name: Compilar APK
        run: ./gradlew --no-daemon assembleRelease --stacktrace

      - name: Preparar arquivo
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk \
             "out/RPG-Dice-v${{ github.run_number }}.apk"
          ls -la out

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: RPG-Dice-apk
          path: out/*.apk

      - name: Publicar release (link direto para baixar no celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rpg-dice-${{ github.run_number }}
          name: RPG Dice — build ${{ github.run_number }}
          body: |
            **RPG Dice** — rolador de dados de RPG em estética dark fantasy.

            Baixe **RPG-Dice-v${{ github.run_number }}.apk** e instale no celular.
            Funciona offline. Android 7.0 ou superior.

            Link creator.
          files: out/*.apk
