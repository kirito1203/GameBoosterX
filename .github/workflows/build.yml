name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar APK (debug)
        run: gradle assembleDebug --stacktrace

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: GameBoosterX-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar link de download (Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk GameBoosterX-ROG.apk
          gh release delete rog-latest -y --cleanup-tag || true
          gh release create rog-latest GameBoosterX-ROG.apk \
            --target "${{ github.sha }}" \
            --title "Game Booster X ROG — build ${{ github.run_number }}" \
            --notes "APK gerado automaticamente a partir do branch ${{ github.ref_name }}. Instala por cima da versão anterior."
