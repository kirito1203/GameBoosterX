plugins {
    id 'com.android.application'
}

android {
    namespace 'com.realme.boosterultra'
    compileSdk 35

    defaultConfig {
        applicationId "com.realme.boosterultra"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "5.2-fps"
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
