plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gameboosterx.rog'
    compileSdk 35

    defaultConfig {
        applicationId 'com.gameboosterx.rog'
        minSdk 30
        targetSdk 35
        versionCode 3
        versionName '1.2.0'
    }

    // Assinatura fixa: cada APK gerado no GitHub tem a mesma assinatura,
    // então as novas versões instalam POR CIMA da anterior (sem desinstalar).
    signingConfigs {
        fixed {
            storeFile file('gbx-release.jks')
            storePassword 'gbxrog2026'
            keyAlias 'gbx'
            keyPassword 'gbxrog2026'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
        release {
            signingConfig signingConfigs.fixed
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// Única dependência: Shizuku (libera FPS real e Turbo avançado sem root e sem terminal).
dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
