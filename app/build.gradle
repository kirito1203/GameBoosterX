plugins {
    id 'com.android.application'
}

// No GitHub Actions o número da execução vira o versionCode, para cada APK novo
// instalar por cima do anterior. Localmente fica 1.
def ciBuild = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'com.pulsesolar.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.pulsesolar.app"
        minSdk 26          // Android 8.0
        targetSdk 35       // Instala e roda normalmente no Android 16
        versionCode ciBuild
        versionName "1.0." + ciBuild
    }

    signingConfigs {
        // Chave de depuração fixa (senha padrão do Android: "android").
        // Sem ela, cada máquina do GitHub geraria uma chave diferente e o
        // celular recusaria instalar a versão nova por cima da antiga.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            // Para publicar na Play Store, crie e use sua própria chave de release.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// Nenhuma dependência externa: somente o Android SDK (o plugin do Android é declarado no build.gradle da raiz).
